version: "2"
linters:
  default: all
  disable:
    - exhaustruct # deprecated (since v2.13.0)
    - gomodguard # deprecated (since v2.12.0)
    - wsl # deprecated (since v2.2.0)
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/gruntwork-io/terragrunt/pkg/config
            - github.com/gruntwork-io/terragrunt/pkg/options
            - github.com/gruntwork-io/terragrunt/pkg/log
            - github.com/wakeful/atlantis-gen-yaml/internal/common
            - github.com/wakeful/atlantis-gen-yaml/internal/parser
            - github.com/wakeful/atlantis-gen-yaml/internal/template
            - github.com/wakeful/atlantis-gen-yaml/internal/terragrunt
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    generated: disable
    rules:
      - linters:
          - exhaustruct # deprecated (since v2.13.0)
          - exhaustruct_v5
          - funlen
          - varnamelen
        path: _test.go
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
